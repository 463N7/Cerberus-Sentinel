[platformio]
default_envs = c5-onboard
src_dir = main
boards_dir = ../boards
extra_configs = platformio.local.ini

[env]
platform = symlink://../../platform/espressif32-c5
board = cerberus_esp32c5
framework = espidf
platform_packages =
    platformio/framework-espidf@4.60001.0
    platformio/toolchain-riscv32-esp@15.2.0+20251204
monitor_speed = 115200

[env:c5-onboard]
build_flags =
    -I ../shared
    -D CERBERUS_C5_DEFAULT_SCAN_ENABLED=0

[env:c5-expansion-xiao]
build_flags =
    -I ../shared
    -D CERBERUS_C5_DEFAULT_SCAN_ENABLED=0
    -D CERBERUS_C5_SLAVE_SPI_SCLK_GPIO=CERBERUS_XIAO_C5_SPI_SCLK_GPIO
    -D CERBERUS_C5_SLAVE_SPI_MOSI_GPIO=CERBERUS_XIAO_C5_SPI_MOSI_GPIO
    -D CERBERUS_C5_SLAVE_SPI_MISO_GPIO=CERBERUS_XIAO_C5_SPI_MISO_GPIO
    -D CERBERUS_C5_SLAVE_SPI_CS_GPIO=CERBERUS_XIAO_C5_SPI_CS_GPIO
    -D CERBERUS_DISABLE_C5_SPI_IRQ=1
    -D CERBERUS_C5_STATUS_LED_GPIO=27

[env:c5-expansion-wroom]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.wroom.defaults"
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
    -I ../shared
    -D CERBERUS_C5_DEFAULT_SCAN_ENABLED=0
    -D CERBERUS_C5_SLAVE_SPI_SCLK_GPIO=CERBERUS_WROOM_C5_SPI_SCLK_GPIO
    -D CERBERUS_C5_SLAVE_SPI_MOSI_GPIO=CERBERUS_WROOM_C5_SPI_MOSI_GPIO
    -D CERBERUS_C5_SLAVE_SPI_MISO_GPIO=CERBERUS_WROOM_C5_SPI_MISO_GPIO
    -D CERBERUS_C5_SLAVE_SPI_CS_GPIO=CERBERUS_WROOM_C5_SPI_CS_GPIO
    -D CERBERUS_DISABLE_C5_SPI_IRQ=1
