name: Check integration host fixtures

on:
  push:
    paths:
      - 's3_main/**'
      - 'c5_firmware/**'
      - 'shared/**'
      - 'expansion/**'
      - 'tools/**'
      - 'sdcard/**'
      - '.github/workflows/host-checks.yml'
  pull_request:
    paths:
      - 's3_main/**'
      - 'c5_firmware/**'
      - 'shared/**'
      - 'expansion/**'
      - 'tools/**'
      - 'sdcard/**'
      - '.github/workflows/host-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned host compiler
        run: python -m pip install ziglang==0.14.1
      - name: Run rev81 host suites
        run: python tools/run_host_checks.py --jobs 2
      - name: Check SD resources
        run: python tools/check_field_kit.py
      - name: Save host-check results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cerberus-host-checks-${{ github.run_number }}
          path: artifacts/host-checks/
          if-no-files-found: ignore
          retention-days: 14
