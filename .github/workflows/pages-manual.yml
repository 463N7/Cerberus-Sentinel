name: Deploy web installer to Pages (optional)

# Primary hosting uses the separate public 463N7/Cerberus-Flasher repository.
# This optional workflow deploys from this private source repository only; it
# does not update the public repository. It is inactive until Pages support for
# this repository and ENABLE_GITHUB_PAGES=true are explicitly configured.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerberus-pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify selected release
        run: |
          python tools/test_sentinel_package.py
          python tools/test_export_web_release.py
          python tools/export_web_release.py --verify-site web/public/firmware
      - name: Install, test, and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Verify published firmware
        run: python tools/export_web_release.py --verify-site web/dist/firmware
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed website
        id: deployment
        uses: actions/deploy-pages@v4
