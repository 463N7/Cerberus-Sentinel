[platformio]
default_envs = c5-onboard
src_dir = main
boards_dir = ../boards

[env]
platform = espressif32@7.0.1
board = cerberus_esp32c5
framework = espidf
platform_packages =
    platformio/framework-espidf@4.60001.0
monitor_speed = 115200

[env:c5-onboard]
board_build.partitions = partitions_2mb.csv
build_flags =
    -I ../shared

[env:c5-panic-diagnostic]
board_build.partitions = partitions_2mb_coredump.csv
board_build.sdkconfig_defaults = sdkconfig.panic.defaults
build_flags =
    -I ../shared
    -DCERBERUS_C5_PANIC_DIAGNOSTIC
