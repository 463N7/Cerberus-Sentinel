[platformio]
default_envs = s3-main
src_dir = s3_main/main
boards_dir = boards

[env]
board_build.sdkconfig_defaults = sdkconfig.defaults
platform_packages =
    platformio/framework-espidf@4.60001.0

[env:s3-main]
board_build.sdkconfig_defaults =
    sdkconfig.defaults
    sdkconfig.radio-lab.defaults
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.radio-lab.defaults"
platform = espressif32@7.0.1
board = cerberus_esp32s3_r2
framework = espidf
board_build.partitions = partitions_16mb.csv
build_flags =
    -I shared
    -DCERBERUS_PRODUCTION_BOARD
monitor_speed = 115200

[env:s3-c5-bridge]
platform = espressif32@7.0.1
board = cerberus_esp32s3_r2
framework = espidf
board_build.partitions = partitions_16mb.csv
board_build.sdkconfig_defaults =
    sdkconfig.defaults
    sdkconfig.c5-bridge.defaults
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.c5-bridge.defaults"
build_flags =
    -I shared
    -DCERBERUS_PRODUCTION_BOARD
    -DCERBERUS_C5_FLASH_BRIDGE
monitor_speed = 115200

[env:s3-c5-diagnostic]
extends = env:s3-main
build_flags =
    ${env:s3-main.build_flags}
    -DCERBERUS_C5_BLE_DIAGNOSTIC

[env:s3-c5-log-bridge]
extends = env:s3-c5-bridge
build_flags =
    ${env:s3-c5-bridge.build_flags}
    -DCERBERUS_C5_LOG_BRIDGE

; C5 firmware has its own PlatformIO project in c5_firmware/.
